<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 260 260" role="img" aria-labelledby="title desc">
  <title id="title">Brigadoc logo</title>
  <desc id="desc">A teal and gold circular emblem with a compass shield and a central leaf, with no visible lettering.</desc>

  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#264A4F"/>
      <stop offset="100%" stop-color="#10262B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D79C"/>
      <stop offset="55%" stop-color="#D7A45E"/>
      <stop offset="100%" stop-color="#B97D3D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D7A45E" flood-opacity="0.18"/>
    </filter>
    </defs>

  <!-- emblem -->
  <g transform="translate(40 32)" filter="url(#softGlow)">
    <circle cx="90" cy="98" r="88" fill="url(#tealGrad)" stroke="#E7C78E" stroke-width="4"/>
    <circle cx="90" cy="98" r="70" fill="none" stroke="#E7C78E" stroke-opacity="0.4" stroke-width="1.75"/>
    <circle cx="90" cy="98" r="54" fill="none" stroke="#E7C78E" stroke-opacity="0.18" stroke-width="1.25"/>

    <!-- subtle four-element ring marks -->
    <path d="M90 3 A95 95 0 0 1 113 6" fill="none" stroke="#7EC8CF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M175 98 A95 95 0 0 1 170 121" fill="none" stroke="#F3A37E" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M90 193 A95 95 0 0 1 67 190" fill="none" stroke="#A7D48C" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M5 98 A95 95 0 0 1 10 75" fill="none" stroke="#B1DDED" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- compass diamonds -->
    <path d="M90 24 L101 51 L90 62 L79 51 Z" fill="#E7C78E" opacity="0.96"/>
    <path d="M164 98 L137 109 L126 98 L137 87 Z" fill="#E7C78E" opacity="0.96"/>
    <path d="M90 172 L79 145 L90 134 L101 145 Z" fill="#E7C78E" opacity="0.96"/>
    <path d="M16 98 L43 87 L54 98 L43 109 Z" fill="#E7C78E" opacity="0.96"/>

    <!-- shield -->
    <path d="M90 48              C108 48 121 56 129 62              L129 99              C129 124 111 143 90 152              C69 143 51 124 51 99              L51 62              C59 56 72 48 90 48 Z" fill="#10262B" stroke="url(#goldGrad)" stroke-width="4.5"/>

    <!-- center leaf / archive mark -->
    <path d="M90 69              C106 69 114 82 114 95              C114 114 101 124 90 131              C79 124 66 114 66 95              C66 82 74 69 90 69 Z" fill="#17373D" stroke="#E7C78E" stroke-width="2.25"/>
    <path d="M90 77              C99 83 102 92 100 101              C98 110 92 116 84 118              C85 109 87 102 90 95              C93 88 96 82 90 77 Z" fill="#D7A45E"/>
    <path d="M83 95 C87 96 91 96 96 94" fill="none" stroke="#F0D7A0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- dividing bar -->
    <path d="M43 182 H137" stroke="#E7C78E" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>

  </svg>
